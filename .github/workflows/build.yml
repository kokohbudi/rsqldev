name: build
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libssl-dev libclang-dev
      - name: Unit + embedded-DB tests
        run: cargo test -p rsqldev-core
      - name: Release build
        run: cargo build --release -p rsqldev
      - uses: actions/upload-artifact@v4
        with:
          name: rsqldev-${{ matrix.os }}
          path: |
            target/release/rsqldev
            target/release/rsqldev.exe
