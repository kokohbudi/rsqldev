# Builds the downloadable packages on every push to main / develop (and for release.yml).
# One Rust cache per platform, saved only from main / develop so tag builds and PRs never
# evict them (the repo has 10 GB of cache); a warm cache recompiles only rsqldev's own crates.
name: build
on:
  # Pushes only: a PR from develop shows the same commit's push build (no second run).
  push:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
env:
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: macos-universal
          save-if: ${{ env.SAVE_CACHE }}
      - name: Universal app bundle (Apple Silicon + Intel)
        run: scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/rsqldev-macos-universal.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: windows
          save-if: ${{ env.SAVE_CACHE }}
      - name: Release build
        run: cargo build --release -p rsqldev
      - name: Zip with the VC++ runtime next to the exe (runs without the redistributable)
        shell: pwsh
        run: |
          $out = "rsqldev-windows-x64"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item target/release/rsqldev.exe $out
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            $p = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $p) { Copy-Item $p $out }
          }
          Compress-Archive -Path $out -DestinationPath "$out.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: rsqldev-windows-x64.zip

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35): the binaries run on Ubuntu 22.04+, Debian 12+, Fedora 36+.
          - { arch: x86_64, runner: ubuntu-22.04, test: true }
          - { arch: aarch64, runner: ubuntu-22.04-arm, test: false }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libssl-dev libclang-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: linux-${{ matrix.arch }}
          save-if: ${{ env.SAVE_CACHE }}
      - name: Unit + embedded-DB tests
        if: matrix.test
        run: cargo test -p rsqldev-core
      - name: Release build
        run: cargo build --release -p rsqldev
      - name: Package
        run: scripts/linux/package.sh "${{ matrix.arch }}" target
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/rsqldev-linux-${{ matrix.arch }}.tar.gz
