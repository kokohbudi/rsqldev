name: build
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit + embedded-DB tests
        run: cargo test -p rsqldev-core
      - name: Release build
        run: cargo build --release -p rsqldev
      - uses: actions/upload-artifact@v4
        with:
          name: rsqldev-${{ matrix.os }}
          path: |
            target/release/rsqldev
            target/release/rsqldev.exe
