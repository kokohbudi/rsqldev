# Build C/C++ deps (wxWidgets, DuckDB, SQLite, ODPI-C) for macOS 11+ instead of the host SDK,
# so the app also runs on older macOS versions.
[env]
MACOSX_DEPLOYMENT_TARGET = "11.0"

# Windows cross-build from macOS (brew install mingw-w64).
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
