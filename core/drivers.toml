# Driver registry. Mirrors the role of DBeaver's plugin.xml <driver> entries, but every
# entry maps to a native backend. `files` = native client libraries downloaded on demand,
# keyed by "<os>-<arch>" (std::env::consts). Backends without files are built in.

# ---------- Oracle ----------
[[driver]]
id = "oracle"
label = "Oracle"
category = "Oracle"
backend = "oracle"
port = 1521
database = "FREEPDB1"
license = "https://www.oracle.com/downloads/licenses/instant-client-lic.html"

[[driver.files]]
os = "macos-aarch64"
version = "23.26.2.0.0"
url = "https://download.oracle.com/otn_software/mac/instantclient/2326200/instantclient-basic-macos.arm64-23.26.2.0.0.dmg"
sha256 = "c3c4fce37a557192322717c1a8422fe098fc829a41f382f57a288b24ad6ba11e"
archive = "dmg"

[[driver.files]]
os = "macos-x86_64"
version = "19.16.0.0.0"
url = "https://download.oracle.com/otn_software/mac/instantclient/1916000/instantclient-basic-macos.x64-19.16.0.0.0dbru.dmg"
sha256 = "725eeb7c00041e926b57c3db508ea7439a1935a37f480c0ac6d46eddc4205331"
archive = "dmg"

[[driver.files]]
os = "windows-x86_64"
version = "23.26.4.0.0"
url = "https://download.oracle.com/otn_software/nt/instantclient/2326400/instantclient-basic-windows.x64-23.26.4.0.0.zip"
sha256 = "09e9b81cd492f5ce6f671317c23a0e1f5dee5e786258149d216321c3dad3023f"
archive = "zip"
strip = 1

