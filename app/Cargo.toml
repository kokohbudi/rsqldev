[package]
name = "rsqldev"
edition.workspace = true
version.workspace = true

[dependencies]
rsqldev-core = { path = "../core" }
wxdragon = { version = "0.9.23", features = ["stc", "aui"] }
serde = { version = "1", features = ["derive"] }
toml = "1"

[build-dependencies]
embed-manifest = "1.4"
winresource = "0.1"
